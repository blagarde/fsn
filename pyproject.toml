[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htfbr-data"
version = "0.1.0"
description = "Provenance-tracked property database for HT-FBR design studies"
requires-python = ">=3.11"
dependencies = ["requests", "pyyaml", "numpy", "pint"]

[project.optional-dependencies]
# ENDF processing also needs NJOY2016 on PATH; install both via setup/install_env.sh (conda-forge).
endf = ["openmc"]
test = ["pytest"]

[project.scripts]
htfbr-data = "htfbr_data.cli:main"

[tool.setuptools]
packages = ["htfbr_data", "htfbr_data.ingest"]

[tool.setuptools.package-data]
htfbr_data = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
