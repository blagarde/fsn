<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 372" role="img" aria-label="A lead-bonded double wall turns one crack into a detectable event" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="wall-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9b9b"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">A lead-bonded double wall turns one crack into a detectable event</text><text x="380" y="54" text-anchor="middle" fill="#5c5c5c">heat flow, ~3–4 MW/m² locally</text><path d="M40 64H720" fill="none" stroke="#9b9b9b" stroke-width="1.25" marker-end="url(#wall-arrow)"></path><g><rect x="24" y="76" width="160" height="140" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b"></rect><text x="104" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Liquid U–Pu fuel</text><text x="104" y="152" text-anchor="middle" fill="#5c5c5c">~2,000 °C</text><text x="104" y="170" text-anchor="middle" fill="#5c5c5c">W-saturated</text></g><g><rect x="184" y="76" width="120" height="140" fill="#b5b2a7" fill-opacity="0.35" stroke="#9b9b9b"></rect><text x="244" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Tungsten</text><text x="244" y="152" text-anchor="middle" fill="#5c5c5c">1.0 mm</text><text x="244" y="170" text-anchor="middle" fill="#5c5c5c">ΔT ~40 K</text></g><g><rect x="304" y="76" width="140" height="140" fill="#efeee9" stroke="#2a6fd4" stroke-width="2"></rect><text x="374" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Liquid Pb bond</text><text x="374" y="152" text-anchor="middle" fill="#5c5c5c">0.4 mm, monitored</text><text x="374" y="170" text-anchor="middle" fill="#5c5c5c">ΔT ~70 K</text></g><g><rect x="444" y="76" width="120" height="140" fill="#b5b2a7" fill-opacity="0.15" stroke="#9b9b9b"></rect><text x="504" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">AlN or ZrB2</text><text x="504" y="152" text-anchor="middle" fill="#5c5c5c">0.3–0.5 mm</text><text x="504" y="170" text-anchor="middle" fill="#5c5c5c">ΔT ~40–50 K</text></g><g><rect x="564" y="76" width="172" height="140" fill="#efeee9" stroke="#9b9b9b"></rect><text x="650" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#1f1f1f">Liquid aluminium</text><text x="650" y="152" text-anchor="middle" fill="#5c5c5c">~1,700 °C outlet</text><text x="650" y="170" text-anchor="middle" fill="#5c5c5c">N-saturated</text></g><g><line x1="374" x2="374" y1="216" y2="240" stroke="#2a6fd4" stroke-width="1.5"></line><text x="374" y="258" text-anchor="middle" font-weight="600" fill="#1f1f1f">Leak monitor in the gap</text><text x="374" y="276" text-anchor="middle" fill="#5c5c5c">U or fission products: fuel-side breach</text><text x="374" y="294" text-anchor="middle" fill="#5c5c5c">Al: coolant-side breach</text></g><text x="24" y="330" fill="#5c5c5c">Pressure order: Al loop above the Pb gap, the gap above the fuel, so any leak runs toward the fuel.</text><text x="24" y="350" fill="#5c5c5c">Assumed: Pb and Al do not mix and Pb barely dissolves W, AlN or ZrB2 (to confirm, Q-031). Wall ΔT ~150 K vs ~85 K single wall.</text></svg>
