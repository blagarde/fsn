y2="130" stroke="#1f1f1f"></line></g><g><rect x="372" y="250" width="16" height="150" fill="#2a6fd4" stroke="#1f1f1f"></rect><rect x="372" y="242" width="16" height="8" fill="#b5b2a7" stroke="#1f1f1f"></rect><rect x="372" y="150" width="16" height="92" fill="#ffffff" stroke="#1f1f1f"></rect><line x1="380" y1="150" x2="380" y2="130" stroke="#1f1f1f"></line></g><line x1="100" y1="130" x2="380" y2="130" stroke="#1f1f1f" stroke-width="3"></line><line x1="380" y1="130" x2="470" y2="130" stroke="#1f1f1f" stroke-width="3"></line><circle cx="480" cy="130" r="10" fill="#ffffff" stroke="#1f1f1f" stroke-width="2"></circle><text x="480" y="134" text-anchor="middle" font-size="11" fill="#1f1f1f">P</text><text x="496" y="126" font-size="11.5" fill="#1f1f1f">Ar pressure</text><text x="496" y="141" font-size="11.5" fill="#5c5c5c">sets the cap</text><text x="100" y="122" font-size="11.5" fill="#5c5c5c">common gas header</text><line x1="82" y1="470" x2="82" y2="396" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"></line><line x1="398" y1="470" x2="398" y2="396" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"></line><text x="90" y="464" font-size="11.5" fill="#1f1f1f">Al in 1,300 K</text><line x1="380" y1="168" x2="460" y2="168" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"></line><text x="464" y="172" font-size="11.5" fill="#1f1f1f">Al out 1,500 K</text><text x="464" y="187" font-size="11.5" fill="#5c5c5c">4,250 kg/s</text><text x="464" y="290" font-size="11.5" fill="#1f1f1f">Active core</text><text x="464" y="305" font-size="11.5" fill="#5c5c5c">3.4 m wide × 1 m</text><line x1="460" y1="295" x2="406" y2="295" stroke="#5c5c5c"></line><text x="464" y="408" font-size="11.5" fill="#1f1f1f">W reflector 20 cm</text><line x1="460" y1="404" x2="420" y2="404" stroke="#5c5c5c"></line><text x="464" y="430" font-size="11.5" fill="#1f1f1f">Depleted-U blanket</text><line x1="460" y1="426" x2="440" y2="426" stroke="#5c5c5c"></line><text x="30" y="508" font-size="11.5" fill="#5c5c5c">Pins hang in the Al stream; fuel never touches</text><text x="30" y="523" font-size="11.5" fill="#5c5c5c">the Al. Each pin is a small sealed pressure cooker.</text><g transform="translate(170,0)"><text x="640" y="80" font-size="13" font-weight="600" fill="#1f1f1f">One pin (r 2.5 cm)</text><rect x="640" y="95" width="150" height="450" fill="#efeee9"></rect><line x1="652" y1="530" x2="652" y2="110" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"></line><line x1="778" y1="530" x2="778" y2="110" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arr)"></line><rect x="670" y="110" width="90" height="420" rx="6" fill="#b5b2a7" stroke="#1f1f1f"></rect><rect x="676" y="110" width="78" height="414" rx="4" fill="#1f1f1f"></rect><rect x="682" y="116" width="66" height="164" fill="#ffffff"></rect><rect x="682" y="280" width="66" height="14" fill="#b5b2a7"></rect><rect x="682" y="294" width="66" height="224" fill="#2a6fd4"></rect><circle cx="700" cy="320" r="4" fill="#ffffff" opacity="0.85"></circle><circle cx="725" cy="350" r="4" fill="#ffffff" opacity="0.85"></circle><circle cx="710" cy="390" r="4" fill="#ffffff" opacity="0.85"></circle><circle cx="732" cy="300" r="4" fill="#ffffff" opacity="0.85"></circle><line x1="715" y1="116" x2="715" y2="96" stroke="#1f1f1f" stroke-width="2"></line><text x="722" y="100" font-size="11" fill="#5c5c5c">to gas header</text><text x="630" y="200" text-anchor="end" font-size="11.5" fill="#1f1f1f">Gas plenum</text><text x="630" y="215" text-anchor="end" font-size="11.5" fill="#5c5c5c">Ar + Pb vapour, 1.9 bar</text><line x1="634" y1="204" x2="682" y2="204" stroke="#5c5c5c"></line><text x="630" y="284" text-anchor="end" font-size="11.5" fill="#1f1f1f">Pb layer (boiling cap)</text><text x="630" y="299" text-anchor="end" font-size="11.5" fill="#5c5c5c">boils at 2,150 K at 1.9 bar</text><line x1="634" y1="287" x2="682" y2="287" stroke="#5c5c5c"></line><text x="630" y="400" text-anchor="end" font-size="11.5" fill="#1f1f1f">Liquid U–Pu, 1 m column</text><text x="630" y="415" text-anchor="end" font-size="11.5" fill="#5c5c5c">264 MW/m³, ≤ 1,970 K in operation</text><text x="630" y="430" text-anchor="end" font-size="11.5" fill="#5c5c5c">convection: 146 K to the wall</text><line x1="634" y1="404" x2="682" y2="404" stroke="#5c5c5c"></line><text x="800" y="330" font-size="11.5" fill="#1f1f1f">W-25Re tube 1.5 mm</text><text x="800" y="345" font-size="11.5" fill="#5c5c5c">inner face 1,830 K</text><line x1="796" y1="334" x2="752" y2="334" stroke="#5c5c5c"></line><text x="800" y="380" font-size="11.5" fill="#1f1f1f">TiB2 layer 1 mm</text><text x="800" y="395" font-size="11.5" fill="#5c5c5c">Al face 1,710 K</text><line x1="796" y1="384" x2="760" y2="384" stroke="#5c5c5c"></line><text x="800" y="430" font-size="11.5" fill="#1f1f1f">Al 0.4 m/s</text><text x="800" y="445" font-size="11.5" fill="#5c5c5c">3 MW/m² through the wall</text><line x1="796" y1="434" x2="782" y2="434" stroke="#5c5c5c"></line><rect x="500" y="556" width="440" height="38" fill="#efeee9" stroke="#9b9b9b"></rect><text x="510" y="572" font-size="11.5" fill="#1f1f1f">Overpower or loss of cooling: fuel reaches 2,150 K, Pb and fuel-side bubbles form,</text><text x="510" y="587" font-size="11.5" fill="#1f1f1f">void worth −175 to −570 pcm per % (OpenMC): the core shuts itself down.</text></g></svg>
