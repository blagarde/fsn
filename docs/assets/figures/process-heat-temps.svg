/g><g><text x="24" y="324" font-size="11.5" fill="#1f1f1f">H2 direct reduction of iron</text><line x1="470" x2="520" y1="320" y2="320" stroke="#2a6fd4" stroke-width="2"><title>H2 direct reduction of iron: 800–1000 °C</title></line><line x1="470" x2="470" y1="315" y2="325" stroke="#2a6fd4" stroke-width="1.5"></line><line x1="520" x2="520" y1="315" y2="325" stroke="#2a6fd4" stroke-width="1.5"></line><circle cx="495" cy="320" r="4" fill="#2a6fd4"><title>H2 direct reduction of iron: 800–1000 °C</title></circle></g><g><text x="24" y="348" font-size="11.5" fill="#1f1f1f">Lime and cement calcination</text><line x1="495" x2="545" y1="344" y2="344" stroke="#2a6fd4" stroke-width="2"><title>Lime and cement calcination: 900–1100 °C</title></line><line x1="495" x2="495" y1="339" y2="349" stroke="#2a6fd4" stroke-width="1.5"></line><line x1="545" x2="545" y1="339" y2="349" stroke="#2a6fd4" stroke-width="1.5"></line><circle cx="520" cy="344" r="4" fill="#2a6fd4"><title>Lime and cement calcination: 900–1100 °C</title></circle></g><g><text x="24" y="372" font-size="11.5" fill="#1f1f1f">Coal and biomass gasification</text><line x1="495" x2="570" y1="368" y2="368" stroke="#2a6fd4" stroke-width="2"><title>Coal and biomass gasification: 900–1200 °C</title></line><line x1="495" x2="495" y1="363" y2="373" stroke="#2a6fd4" stroke-width="1.5"></line><line x1="570" x2="570" y1="363" y2="373" stroke="#2a6fd4" stroke-width="1.5"></line><circle cx="532.5" cy="368" r="4" fill="#2a6fd4"><title>Coal and biomass gasification: 900–1200 °C</title></circle></g><g><text x="24" y="396" font-size="11.5" fill="#1f1f1f">Alumina calcination</text><line x1="520" x2="545" y1="392" y2="392" stroke="#2a6fd4" stroke-width="2"><title>Alumina calcination: 1000–1100 °C</title></line><line x1="520" x2="520" y1="387" y2="397" stroke="#2a6fd4" stroke-width="1.5"></line><line x1="545" x2="545" y1="387" y2="397" stroke="#2a6fd4" stroke-width="1.5"></line><circle cx="532.5" cy="392" r="4" fill="#2a6fd4"><title>Alumina calcination: 1000–1100 °C</title></circle></g><g><text x="24" y="420" font-size="11.5" fill="#1f1f1f">Cement clinkering</text><line x1="620" x2="645" y1="416" y2="416" stroke="#b5b2a7" stroke-width="2"><title>Cement clinkering: 1400–1500 °C</title></line><line x1="620" x2="620" y1="411" y2="421" stroke="#b5b2a7" stroke-width="1.5"></line><line x1="645" x2="645" y1="411" y2="421" stroke="#b5b2a7" stroke-width="1.5"></line><circle cx="632.5" cy="416" r="4" fill="#b5b2a7"><title>Cement clinkering: 1400–1500 °C</title></circle></g><g><text x="24" y="444" font-size="11.5" fill="#1f1f1f">Glass melting</text><line x1="620" x2="670" y1="440" y2="440" stroke="#b5b2a7" stroke-width="2"><title>Glass melting: 1400–1600 °C</title></line><line x1="620" x2="620" y1="435" y2="445" stroke="#b5b2a7" stroke-width="1.5"></line><line x1="670" x2="670" y1="435" y2="445" stroke="#b5b2a7" stroke-width="1.5"></line><circle cx="645" cy="440" r="4" fill="#b5b2a7"><title>Glass melting: 1400–1600 °C</title></circle></g><g><text x="24" y="468" font-size="11.5" fill="#1f1f1f">Steel melting (EAF, BOF)</text><line x1="670" x2="695" y1="464" y2="464" stroke="#b5b2a7" stroke-width="2"><title>Steel melting (EAF, BOF): 1600–1700 °C</title></line><line x1="670" x2="670" y1="459" y2="469" stroke="#b5b2a7" stroke-width="1.5"></line><line x1="695" x2="695" y1="459" y2="469" stroke="#b5b2a7" stroke-width="1.5"></line><circle cx="682.5" cy="464" r="4" fill="#b5b2a7"><title>Steel melting (EAF, BOF): 1600–1700 °C</title></circle></g></g><g><line x1="270" x2="720" y1="480" y2="480" stroke="#9b9b9b"></line><text x="270" y="498" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0</text><text x="345" y="498" text-anchor="middle" font-size="11.5" fill="#5c5c5c">300</text><text x="420" y="498" text-anchor="middle" font-size="11.5" fill="#5c5c5c">600</text><text x="495" y="498" text-anchor="middle" font-size="11.5" fill="#5c5c5c">900</text><text x="570" y="498" text-anchor="middle" font-size="11.5" fill="#5c5c5c">1,200</text><text x="645" y="498" text-anchor="middle" font-size="11.5" fill="#5c5c5c">1,500</text><text x="720" y="498" text-anchor="middle" font-size="11.5" fill="#5c5c5c">1,800</text><text x="720" y="520" text-anchor="end" font-size="11.5" fill="#5c5c5c">Process temperature (°C)</text></g><g><circle cx="30" cy="516" r="4" fill="#2a6fd4"></circle><text x="40" y="520" font-size="11.5" fill="#5c5c5c">Needs 750–1,100 °C: opened by the HT-FBR</text><circle cx="30" cy="536" r="4" fill="#b5b2a7"></circle><text x="40" y="540" font-size="11.5" fill="#5c5c5c">Served by existing reactors, or beyond reach</text></g></svg>
