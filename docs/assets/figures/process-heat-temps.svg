<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 572" role="img" aria-label="Delivering heat near 1,100 °C reaches every major process except melting" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Delivering heat near 1,100 °C reaches every major process except melting</text><text x="24" y="48" font-size="11.5" fill="#5c5c5c">Process temperature ranges, approximate; dot marks the midpoint</text><g><line x1="270" x2="270" y1="88" y2="480" stroke="#e4e4e4"></line><line x1="345" x2="345" y1="88" y2="480" stroke="#e4e4e4"></line><line x1="420" x2="420" y1="88" y2="480" stroke="#e4e4e4"></line><line x1="495" x2="495" y1="88" y2="480" stroke="#e4e4e4"></line><line x1="570" x2="570" y1="88" y2="480" stroke="#e4e4e4"></line><line x1="645" x2="645" y1="88" y2="480" stroke="#e4e4e4"></line><line x1="720" x2="720" y1="88" y2="480" stroke="#e4e4e4"></line></g><g><g><line x1="457.5" x2="457.5" y1="80" y2="480" stroke="#8a8a8a" stroke-width="1.25" stroke-dasharray="4 4"></line><text x="451.5" y="74" text-anchor="end" font-size="11.5" fill="#5c5c5c">Baseline delivery 750 °C</text></g><g><line x1="545" x2="545" y1="80" y2="480" stroke="#8a8a8a" stroke-width="1.25" stroke-dasharray="4 4"></line><text x="551" y="74" text-anchor="start" font-size="11.5" fill="#5c5c5c">Stretch delivery 1,100 °C</text></g></g><g><g><text x="24" y="108" font-size="11.5" fill="#1f1f1f">District heat, desalination</text><line x1="290" x2="307.5" y1="104" y2="104" stroke="#b5b2a7" stroke-width="2"><title>District heat, desalination: 80–150 °C</title></line><line x1="290" x2="290" y1="99" y2="109" stroke="#b5b2a7" stroke-width="1.5"></line><line x1="307.5" x2="307.5" y1="99" y2="109" stroke="#b5b2a7" stroke-width="1.5"></line><circle cx="298.75" cy="104" r="4" fill="#b5b2a7"><title>District heat, desalination: 80–150 °C</title></circle></g><g><text x="24" y="132" fon