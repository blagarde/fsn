<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 448" role="img" aria-label="Light carrier droplets pick up heat in the fuel and separate by density" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="dc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9b9b"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Light carrier droplets pick up heat in the fuel and separate by density</text><g><rect x="220" y="194" width="240" height="210" fill="#efeee9"></rect><rect x="220" y="134" width="240" height="60" fill="#2a6fd4" fill-opacity="0.12"></rect><line x1="220" x2="460" y1="134" y2="134" stroke="#9b9b9b" stroke-dasharray="3 3"></line><line x1="220" x2="460" y1="194" y2="194" stroke="#2a6fd4" stroke-width="1.5"></line><rect x="220" y="104" width="240" height="300" rx="8" fill="none" stroke="#9b9b9b" stroke-width="2"></rect><text x="236" y="124" font-size="11.5" fill="#5c5c5c">Cover gas</text><text x="236" y="158" font-size="11.5" font-weight="600" fill="#1f1f1f">Carrier layer: CaF2 or Ca</text><text x="236" y="176" font-size="11.5" fill="#5c5c5c">density about 1 to 2.4 g/cm³</text><text x="236" y="222" font-size="11.5" font-weight="600" fill="#1f1f1f">Liquid U–Pu metal fuel</text><text x="236" y="240" font-size="11.5" fill="#5c5c5c">~2,000 °C · about 16 g/cm³</text><circle cx="262" cy="372" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="300" cy="350" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="338" cy="380" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="376" cy="336" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="414" cy="364" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="282" cy="310" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="356" cy="296" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="400" cy="286" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="318" cy="270" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><circle cx="436" cy="316" r="5" fill="#2a6fd4" fill-opacity="0.35" stroke="#2a6fd4" stroke-width="1.25"></circle><line x1="240" x2="440" y1="392" y2="392" stroke="#2a6fd4" stroke-width="2" stroke-dasharray="6 4"></line><text x="436" y="384" text-anchor="end" font-size="11.5" fill="#5c5c5c">injector</text><text x="340" y="426" text-anchor="middle" font-size="11.5" fill="#5c5c5c">W or Ta vessel: low pressure, kept above ~1,100 °C</text></g><g fill="none" stroke="#9b9b9b" stroke-width="1.25"><path d="M220 119H188" marker-end="url(#dc-arrow)"></path><path d="M220 390H188" marker-end="url(#dc-arrow)"></path><path d="M460 164H540" marker-end="url(#dc-arrow)"></path><path d="M540 196H500V392H460" marker-end="url(#dc-arrow)"></path><path d="M638 212V300" marker-end="url(#dc-arrow)"></path></g><g><rect x="24" y="104" width="164" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="40" y="128" font-weight="600" fill="#1f1f1f">Off-gas system</text><text x="40" y="144" font-size="11.5" fill="#5c5c5c">volatile FPs: Xe, Kr,</text><text x="40" y="160" font-size="11.5" fill="#5c5c5c">Cs, I, Sm, Eu</text></g><g><rect x="24" y="332" width="164" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="40" y="356" font-weight="600" fill="#1f1f1f">Drain tank</text><text x="40" y="372" font-size="11.5" fill="#5c5c5c">guard-heated,</text><text x="40" y="388" font-size="11.5" fill="#5c5c5c">kept above ~1,100 °C</text></g><g><rect x="540" y="140" width="196" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="556" y="164" font-weight="600" fill="#1f1f1f">Heat exchanger</text><text x="556" y="180" font-size="11.5" fill="#5c5c5c">or condenser for Ca vapour;</text><text x="556" y="196" font-size="11.5" fill="#5c5c5c">delivers ~1,800 °C</text></g><g><rect x="540" y="300" width="196" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="556" y="324" font-weight="600" fill="#1f1f1f">Power or melting</text><text x="556" y="340" font-size="11.5" fill="#5c5c5c">~60% combined cycle, or</text><text x="556" y="356" font-size="11.5" fill="#5c5c5c">steel, silicon, glass melting</text></g><text x="500" y="156" text-anchor="middle" font-size="11.5" fill="#5c5c5c">hot carrier</text><text x="508" y="262" font-size="11.5" fill="#5c5c5c">cooled carrier</text></svg>
