<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 616" role="img" aria-label="Materials are screened as compatible stacks, not one by one" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="mat-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9b9b"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Materials are screened as compatible stacks, not one by one</text><g fill="none" stroke="#9b9b9b" stroke-width="1.25"><path d="M254 136V160" marker-end="url(#mat-arrow)"></path><path d="M254 232V256" marker-end="url(#mat-arrow)"></path><path d="M254 328V352" marker-end="url(#mat-arrow)"></path><path d="M254 424V448" marker-end="url(#mat-arrow)"></path><path d="M254 520V544" marker-end="url(#mat-arrow)"></path><path d="M532 292H484" marker-end="url(#mat-arrow)"></path><path d="M634 328V388H484" marker-end="url(#mat-arrow)"></path><path d="M484 484H532" marker-end="url(#mat-arrow)"></path><path d="M716 448V328" marker-end="url(#mat-arrow)"></path></g><g><rect x="24" y="64" width="460" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="40" y="88" font-weight="600" fill="#1f1f1f">Stage 0 · Requirements envelope</text><text x="40" y="108" font-size="11.5" fill="#5c5c5c">Per component: temperature range, dose (dpa), spectrum,</text><text x="40" y="124" font-size="11.5" fill="#5c5c5c">chemical environment, stress, transient excursions</text></g><g><rect x="24" y="160" width="460" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="40" y="184" font-weight="600" fill="#1f1f1f">Stage 1 · Hard gates (pass / fail)</text><text x="40" y="204" font-size="11.5" fill="#5c5c5c">Phase window, neutron absorption and moderation, basic</text><text x="40" y="220" font-size="11.5" fill="#5c5c5c">chemical stability, isotopes obtainable</text></g><g><rect x="24" y="256" width="460" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="40" y="280" font-weight="600" fill="#1f1f1f">Stage 2 · Figure-of-merit scoring</text><text x="40" y="300" font-size="11.5" fill="#5c5c5c">Each criterion mapped to a 0–1 utility, weighted per</text><text x="40" y="316" font-size="11.5" fill="#5c5c5c">component; data uncertainty carried as a score range</text></g><g><rect x="24" y="352" width="460" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="40" y="376" font-weight="600" fill="#1f1f1f">Stage 3 · Compatibility stacks</text><text x="40" y="396" font-size="11.5" fill="#5c5c5c">Fuel, cladding, coolant, structure, working fluid checked</text><text x="40" y="412" font-size="11.5" fill="#5c5c5c">pair by pair; one failed pair rejects the stack</text></g><g><rect x="24" y="448" width="460" height="72" rx="8" fill="none" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="40" y="472" font-weight="600" fill="#1f1f1f">Stage 4 · Pareto front and robustness</text><text x="40" y="492" font-size="11.5" fill="#5c5c5c">Keep non-dominated stacks; test the ranking against</text><text x="40" y="508" font-size="11.5" fill="#5c5c5c">weight changes and property uncertainty</text></g><g><rect x="532" y="256" width="204" height="72" rx="8" fill="#efeee9" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="548" y="280" font-weight="600" fill="#1f1f1f">Property database</text><text x="548" y="300" font-size="11.5" fill="#5c5c5c">values with uncertainty,</text><text x="548" y="316" font-size="11.5" fill="#5c5c5c">by temperature and dose</text></g><g><rect x="532" y="448" width="204" height="72" rx="8" fill="#efeee9" stroke="#9b9b9b" stroke-width="1.25"></rect><text x="548" y="472" font-weight="600" fill="#1f1f1f">Gap filling</text><text x="548" y="492" font-size="11.5" fill="#5c5c5c">DFT, MD, CALPHAD or a</text><text x="548" y="508" font-size="11.5" fill="#5c5c5c">targeted experiment</text></g><text x="508" y="440" text-anchor="middle" font-size="11.5" fill="#5c5c5c">data gap</text><g><rect x="24" y="544" width="460" height="48" rx="8" fill="#2a6fd4" fill-opacity="0.12" stroke="#2a6fd4" stroke-width="2"></rect><text x="254" y="572" text-anchor="middle" font-weight="600" fill="#1f1f1f">Shortlist: 3–5 material stacks per taxonomy branch</text></g></svg>
