<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 392" role="img" aria-label="Fuel phase by coolant phase: where high-temperature breeder concepts can live" font-size="11"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1f">Condensed fuel with liquid or gas coolant is the core of the space; gas fuel cannot breed</text><text x="24" y="50" font-size="11.5" fill="#5c5c5c">Fuel phase by coolant phase (heat-transport mode). Labels are geometry IDs from the study page.</text><g><text x="182" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Solid</text><text x="182" y="90" text-anchor="middle" fill="#5c5c5c">conduction</text></g><g><text x="246" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Granular</text><text x="246" y="90" text-anchor="middle" fill="#5c5c5c">solid</text></g><g><text x="310" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Melting</text><text x="310" y="90" text-anchor="middle" fill="#5c5c5c">carrier</text></g><g><text x="374" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Liquid</text><text x="374" y="90" text-anchor="middle" fill="#5c5c5c"> </text></g><g><text x="438" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Boiling /</text><text x="438" y="90" text-anchor="middle" fill="#5c5c5c">heat pipe</text></g><g><text x="502" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Super-</text><text x="502" y="90" text-anchor="middle" fill="#5c5c5c">critical</text></g><g><text x="566" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Gas</text><text x="566" y="90" text-anchor="middle" fill="#5c5c5c"> </text></g><g><text x="630" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Plasma</text><text x="630" y="90" text-anchor="middle" fill="#5c5c5c"> </text></g><g><text x="694" y="76" text-anchor="middle" font-weight="600" fill="#1f1f1f">Radiative<