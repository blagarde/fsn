<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 960 470" role="img" aria-label="A molten U-Pu slab self-regulates only within about half a millimetre of thickness; heat removal sets how much power it makes there" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">A molten U–Pu slab self-regulates only within ~0.5 mm of thickness</text><text x="24" y="48" font-size="11.5" fill="#5c5c5c">Self-regulated power vs extra thickness above cold criticality (20.53 cm), 3 m × 3 m slab, Pu 15 %, sink 1,500 K. Calculated (pool.py).</text><g><line x1="80" x2="600" y1="352.64217567916126" y2="352.64217567916126" stroke="#e4e4e4"></line><text x="72" y="356.64217567916126" text-anchor="end" font-size="11.5" fill="#5c5c5c">1</text></g><g><line x1="80" x2="600" y1="261.76145045277417" y2="261.76145045277417" stroke="#e4e4e4"></line><text x="72" y="265.76145045277417" text-anchor="end" font-size="11.5" fill="#5c5c5c">10</text></g><g><line x1="80" x2="600" y1="170.88072522638706" y2="170.88072522638706" stroke="#e4e4e4"></line><text x="72" y="174.88072522638706" text-anchor="end" font-size="11.5" fill="#5c5c5c">100</text></g><g><line x1="80" x2="600" y1="80" y2="80" stroke="#e4e4e4"></line><text x="72" y="84" text-anchor="end" font-size="11.5" fill="#5c5c5c">1,000</text></g><text x="24" y="70" font-size="11.5" fill="#5c5c5c">Power (MW)</text><line x1="80" x2="600" y1="380" y2="380" stroke="#9b9b9b"></line><text x="80" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.0</text><text x="154.28571428571428" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.1</text><text x="228.57142857142858" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.2</text><text x="302.8571428571429" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.3</text><text x="377.14285714285717" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.4</text><text x="451.42857142857144" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.5</text><text x="525.7142857142858" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.6</text><text x="600" y="398" text-anchor="middle" font-size="11.5" fill="#5c5c5c">0.7</text><text x="600" y="420" text-anchor="end" font-size="11.5" fill="#5c5c5c">Thickness above cold criticality (mm)</text><g><path d="M129.0 180.0L227.1 137.2L325.1 117.9L423.2 105.5L521.3 96.6L570.3 94.1" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-dasharray=""></path><circle cx="129.02857142857144" cy="179.98511061862766" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Well mixed liquid, convective faces: 79.4 MW at +0.066 mm</title></circle><circle cx="227.0857142857143" cy="137.22504730774205" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Well mixed liquid, convective faces: 234.6 MW at +0.198 mm</title></circle><circle cx="325.14285714285717" cy="117.88950426381564" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Well mixed liquid, convective faces: 382.9 MW at +0.33 mm</title></circle><circle cx="423.2" cy="105.53751669845946" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Well mixed liquid, convective faces: 523.6 MW at +0.462 mm</title></circle><circle cx="521.2571428571428" cy="96.61585273618539" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Well mixed liquid, convective faces: 656.4 MW at +0.594 mm</title></circle><circle cx="570.2857142857143" cy="94.05505519111318" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Well mixed liquid, convective faces: 700.4 MW at +0.66 mm</title></circle><path d="M565.2857142857143 89.05505519111318L575.2857142857143 99.05505519111318M565.2857142857143 99.05505519111318L575.2857142857143 89.05505519111318" stroke="#1f1f1f" stroke-width="2"></path><text x="610" y="98.05505519111318" font-size="11.5" fill="#1f1f1f">Well mixed liquid, convective faces: 700 MW</text></g><g><path d="M114.9 235.8L184.7 193.3L254.6 174.1L324.4 161.8L394.2 153.0L429.1 150.9" fill="none" stroke="#1f1f1f" stroke-width="2" stroke-dasharray="6 4"></path><circle cx="114.91428571428571" cy="235.80979511645214" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Convection Nu = 10: 19.3 MW at +0.047 mm</title></circle><circle cx="184.74285714285713" cy="193.27527554226765" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Convection Nu = 10: 56.7 MW at +0.141 mm</title></circle><circle cx="254.57142857142858" cy="174.08600469909996" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Convection Nu = 10: 92.2 MW at +0.235 mm</title></circle><circle cx="324.4" cy="161.82167627134717" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Convection Nu = 10: 125.8 MW at +0.329 mm</title></circle><circle cx="394.22857142857146" cy="153.00187624152204" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Convection Nu = 10: 157.3 MW at +0.423 mm</title></circle><circle cx="429.14285714285717" cy="150.924724235543" r="4" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"><title>Convection Nu = 10: 165.8 MW at +0.47 mm</title></circle><path d="M424.14285714285717 145.924724235543L434.14285714285717 155.924724235543M424.14285714285717 155.924724235543L434.14285714285717 145.924724235543" stroke="#1f1f1f" stroke-width="2"></path><text x="610" y="154.924724235543" font-size="11.5" fill="#1f1f1f">Convection Nu = 10: 166 MW</text></g><g><path d="M111.2 316.6L173.6 274.1L236.0 254.9L298.4 242.7L360.8 234.0L392.0 232.1" fill="none" stroke="#2a6fd4" stroke-width="2" stroke-dasharray=""></path><circle cx="111.2" cy="316.6352916808797" r="4" fill="#2a6fd4" stroke="#ffffff" stroke-width="2"><title>Conduction only, two cooled faces: 2.49 MW at +0.042 mm</title></circle><circle cx="173.60000000000002" cy="274.12873792555285" r="4" fill="#2a6fd4" stroke="#ffffff" stroke-width="2"><title>Conduction only, two cooled faces: 7.31 MW at +0.126 mm</title></circle><circle cx="236" cy="254.8956878127711" r="4" fill="#2a6fd4" stroke="#ffffff" stroke-width="2"><title>Conduction only, two cooled faces: 11.9 MW at +0.21 mm</title></circle><circle cx="298.4" cy="242.72057398532283" r="4" fill="#2a6fd4" stroke="#ffffff" stroke-width="2"><title>Conduction only, two cooled faces: 16.2 MW at +0.294 mm</title></circle><circle cx="360.8" cy="234.01089654859453" r="4" fill="#2a6fd4" stroke="#ffffff" stroke-width="2"><title>Conduction only, two cooled faces: 20.2 MW at +0.378 mm</title></circle><circle cx="392" cy="232.10381074419183" r="4" fill="#2a6fd4" stroke="#ffffff" stroke-width="2"><title>Conduction only, two cooled faces: 21.2 MW at +0.42 mm</title></circle><path d="M387 227.10381074419183L397 237.10381074419183M387 237.10381074419183L397 227.10381074419183" stroke="#2a6fd4" stroke-width="2"></path><text x="610" y="236.10381074419183" font-size="11.5" fill="#1f1f1f">Conduction only, two cooled faces: 21.2 MW</text></g><g><path d="M117.1 344.8L190.7 298.2L264.2 276.0L337.8 261.4L411.3 250.8L447.7 248.2" fill="none" stroke="#b5b2a7" stroke-width="2" stroke-dasharray=""></path><circle cx="117.14285714285714" cy="344.7937316370121" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Radiation to a 1,500 K wall: 1.22 MW at +0.05 mm</title></circle><circle cx="190.68571428571428" cy="298.2236601658535" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Radiation to a 1,500 K wall: 3.97 MW at +0.149 mm</title></circle><circle cx="264.22857142857146" cy="275.95198288494896" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Radiation to a 1,500 K wall: 6.98 MW at +0.248 mm</title></circle><circle cx="337.7714285714286" cy="261.3687208694333" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Radiation to a 1,500 K wall: 10.1 MW at +0.347 mm</title></circle><circle cx="411.31428571428575" cy="250.80360414139003" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Radiation to a 1,500 K wall: 13.2 MW at +0.446 mm</title></circle><circle cx="447.7142857142857" cy="248.20030927701526" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Radiation to a 1,500 K wall: 14.1 MW at +0.495 mm</title></circle><path d="M442.7142857142857 243.20030927701526L452.7142857142857 253.20030927701526M442.7142857142857 253.20030927701526L452.7142857142857 243.20030927701526" stroke="#b5b2a7" stroke-width="2"></path><text x="610" y="252.20030927701526" font-size="11.5" fill="#1f1f1f">Radiation to a 1,500 K wall: 14.1 MW</text></g><g><path d="M112.7 365.6L177.3 323.4L242.7 304.3L307.3 292.3L372.7 283.6L405.4 281.7" fill="none" stroke="#b5b2a7" stroke-width="2" stroke-dasharray="6 4"></path><circle cx="112.68571428571428" cy="365.6079018697257" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Conduction, one cooled face: 0.72 MW at +0.044 mm</title></circle><circle cx="177.31428571428575" cy="323.3586524918077" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Conduction, one cooled face: 2.1 MW at +0.131 mm</title></circle><circle cx="242.6857142857143" cy="304.34098625582624" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Conduction, one cooled face: 3.4 MW at +0.219 mm</title></circle><circle cx="307.3142857142857" cy="292.32455424632576" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Conduction, one cooled face: 4.61 MW at +0.306 mm</title></circle><circle cx="372.6857142857143" cy="283.6030110226012" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Conduction, one cooled face: 5.75 MW at +0.394 mm</title></circle><circle cx="405.3714285714286" cy="281.6609722686756" r="4" fill="#b5b2a7" stroke="#ffffff" stroke-width="2"><title>Conduction, one cooled face: 6.04 MW at +0.438 mm</title></circle><path d="M400.3714285714286 276.6609722686756L410.3714285714286 286.6609722686756M400.3714285714286 286.6609722686756L410.3714285714286 276.6609722686756" stroke="#b5b2a7" stroke-width="2"></path><text x="610" y="285.6609722686756" font-size="11.5" fill="#1f1f1f">Conduction, one cooled face: 6.04 MW</text></g><text x="24" y="440" font-size="11" fill="#5c5c5c">× = runaway: still supercritical when the hottest point reaches 3,500 K. Thinner than 0 mm: subcritical, no power.</text><text x="24" y="456" font-size="11" fill="#5c5c5c">All feedback from 1,500 K to 3,500 K is only ~200 pcm: Doppler ≈ 0 in this hard spectrum, and expansion nearly cancels in a laterally confined slab.</text></svg>
