<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 664" role="img" aria-label="Four ways to arrange fuel, walls and aluminium in an A2 core" font-size="11.5"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="geo-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9b9b"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">Four ways to arrange fuel, walls and aluminium in an A2 core</text><g><rect x="24" y="64" width="344" height="268" rx="8" fill="none" stroke="#e4e4e4" stroke-width="1.25"></rect><rect x="48" y="120" width="120" height="176" rx="6" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1.5"></rect><rect x="62" y="106" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="84" y="106" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="106" y="106" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="128" y="106" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="150" y="106" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><g fill="none" stroke="#9b9b9b" stroke-width="1"><path d="M66 304V114" marker-end="url(#geo-arrow)"></path><path d="M88 304V114" marker-end="url(#geo-arrow)"></path><path d="M110 304V114" marker-end="url(#geo-arrow)"></path><path d="M132 304V114" marker-end="url(#geo-arrow)"></path><path d="M154 304V114" marker-end="url(#geo-arrow)"></path></g><text x="40" y="90" font-size="13" font-weight="600" fill="#1f1f1f">G1 · Straight tubes in a fuel pool</text><text x="188" y="136" fill="#5c5c5c">Al flows up through</text><text x="188" y="154" fill="#5c5c5c">~2,900 straight tubes;</text><text x="188" y="172" fill="#5c5c5c">fuel sits still between</text><text x="188" y="202" fill="#1f1f1f">+ simplest; the reference</text><text x="188" y="220" fill="#1f1f1f">  used in the sizing</text><text x="188" y="250" fill="#1f1f1f">− every tube pierces</text><text x="188" y="268" fill="#1f1f1f">  the vessel floor</text></g><g><rect x="392" y="64" width="344" height="268" rx="8" fill="none" stroke="#e4e4e4" stroke-width="1.25"></rect><rect x="416" y="120" width="120" height="176" rx="6" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1.5"></rect><rect x="428" y="106" width="14" height="162" rx="7" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="456" y="106" width="14" height="162" rx="7" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="484" y="106" width="14" height="162" rx="7" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="512" y="106" width="14" height="162" rx="7" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><g fill="none" stroke="#9b9b9b" stroke-width="1"><path d="M435 112V256" marker-end="url(#geo-arrow)"></path><path d="M463 112V256" marker-end="url(#geo-arrow)"></path><path d="M491 112V256" marker-end="url(#geo-arrow)"></path><path d="M519 112V256" marker-end="url(#geo-arrow)"></path><path d="M439.5 250V124" marker-end="url(#geo-arrow)"></path><path d="M467.5 250V124" marker-end="url(#geo-arrow)"></path><path d="M495.5 250V124" marker-end="url(#geo-arrow)"></path><path d="M523.5 250V124" marker-end="url(#geo-arrow)"></path></g><text x="408" y="90" font-size="13" font-weight="600" fill="#1f1f1f">G2 · Bayonet tubes from the lid</text><text x="556" y="136" fill="#5c5c5c">Tubes hang from the lid,</text><text x="556" y="154" fill="#5c5c5c">closed at the bottom; Al</text><text x="556" y="172" fill="#5c5c5c">goes down, then back up</text><text x="556" y="202" fill="#1f1f1f">+ nothing pierces the floor</text><text x="556" y="220" fill="#1f1f1f">+ bundles lift out</text><text x="556" y="250" fill="#1f1f1f">− down and up streams</text><text x="556" y="268" fill="#1f1f1f">  exchange heat</text></g><g><rect x="24" y="348" width="344" height="268" rx="8" fill="none" stroke="#e4e4e4" stroke-width="1.25"></rect><rect x="48" y="404" width="120" height="176" rx="6" fill="#efeee9" stroke="#9b9b9b" stroke-width="1.5"></rect><line x1="48" x2="168" y1="420" y2="420" stroke="#9b9b9b" stroke-dasharray="3 3"></line><rect x="62" y="432" width="10" height="148" rx="5" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1"></rect><rect x="84" y="432" width="10" height="148" rx="5" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1"></rect><rect x="106" y="432" width="10" height="148" rx="5" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1"></rect><rect x="128" y="432" width="10" height="148" rx="5" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1"></rect><rect x="150" y="432" width="10" height="148" rx="5" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1"></rect><line x1="67" x2="67" y1="432" y2="420" stroke="#9b9b9b" stroke-width="1"></line><line x1="89" x2="89" y1="432" y2="420" stroke="#9b9b9b" stroke-width="1"></line><line x1="111" x2="111" y1="432" y2="420" stroke="#9b9b9b" stroke-width="1"></line><line x1="133" x2="133" y1="432" y2="420" stroke="#9b9b9b" stroke-width="1"></line><line x1="155" x2="155" y1="432" y2="420" stroke="#9b9b9b" stroke-width="1"></line><g fill="none" stroke="#9b9b9b" stroke-width="1"><path d="M78 574V440" marker-end="url(#geo-arrow)"></path><path d="M100 574V440" marker-end="url(#geo-arrow)"></path><path d="M122 574V440" marker-end="url(#geo-arrow)"></path><path d="M144 574V440" marker-end="url(#geo-arrow)"></path></g><text x="40" y="374" font-size="13" font-weight="600" fill="#1f1f1f">G3 · Liquid-fuel pins in flowing Al</text><text x="188" y="420" fill="#5c5c5c">Fuel sealed in thin pins,</text><text x="188" y="438" fill="#5c5c5c">vented to a gas plenum;</text><text x="188" y="456" fill="#5c5c5c">Al flows around them</text><text x="188" y="486" fill="#1f1f1f">+ fuel path = pin radius</text><text x="188" y="504" fill="#1f1f1f">+ a breach stays local</text><text x="188" y="534" fill="#1f1f1f">− many pin walls and</text><text x="188" y="552" fill="#1f1f1f">  gas vents to qualify</text></g><g><rect x="392" y="348" width="344" height="268" rx="8" fill="none" stroke="#e4e4e4" stroke-width="1.25"></rect><rect x="416" y="404" width="120" height="176" rx="6" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b" stroke-width="1.5"></rect><line x1="442" x2="442" y1="424" y2="556" stroke="#9b9b9b" stroke-width="1.5"></line><line x1="510" x2="510" y1="424" y2="556" stroke="#9b9b9b" stroke-width="1.5"></line><rect x="452" y="390" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="470" y="390" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><rect x="488" y="390" width="8" height="204" fill="#efeee9" stroke="#9b9b9b" stroke-width="1"></rect><g fill="none" stroke="#9b9b9b" stroke-width="1"><path d="M465 550V432" marker-end="url(#geo-arrow)"></path><path d="M483 550V432" marker-end="url(#geo-arrow)"></path><path d="M429 430V552" marker-end="url(#geo-arrow)"></path><path d="M523 430V552" marker-end="url(#geo-arrow)"></path></g><circle cx="429" cy="490" r="7" fill="#efeee9" stroke="#9b9b9b" stroke-width="1.25"></circle><text x="408" y="374" font-size="13" font-weight="600" fill="#1f1f1f">G4 · Pumped fuel through the bundle</text><text x="556" y="420" fill="#5c5c5c">In-vessel pump drives fuel</text><text x="556" y="438" fill="#5c5c5c">up through the bundle and</text><text x="556" y="456" fill="#5c5c5c">down the outer annulus</text><text x="556" y="486" fill="#1f1f1f">+ cuts the fuel-side drop</text><text x="556" y="516" fill="#1f1f1f">− moves some delayed-</text><text x="556" y="534" fill="#1f1f1f">  neutron precursors out</text><text x="556" y="552" fill="#1f1f1f">  of the bundle</text></g><g><rect x="24" y="630" width="16" height="12" rx="2" fill="#2a6fd4" fill-opacity="0.22" stroke="#9b9b9b"></rect><text x="48" y="640" fill="#5c5c5c">Liquid U–Pu fuel</text><rect x="200" y="630" width="16" height="12" rx="2" fill="#efeee9" stroke="#9b9b9b"></rect><text x="224" y="640" fill="#5c5c5c">Liquid aluminium</text><line x1="376" x2="400" y1="636" y2="636" stroke="#9b9b9b" stroke-width="1.5"></line><text x="408" y="640" fill="#5c5c5c">Wall: W/AlN or ZrB2 (B-11); arrows show flow</text></g></svg>
