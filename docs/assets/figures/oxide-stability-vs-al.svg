<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 460" role="img" aria-label="Oxides more stable than Al2O3 resist molten aluminium; three are usable" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Oxides more stable than Al2O3 resist molten aluminium; three are usable</text><text x="24" y="48" font-size="11.5" fill="#5c5c5c">Magnitude of standard Gibbs energy of formation at 25 °C, kJ per mol O2. Right of the line, Al cannot reduce it.</text><g><line x1="150" x2="560" y1="104" y2="104" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="132" y2="132" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="160" y2="160" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="188" y2="188" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="216" y2="216" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="244" y2="244" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="272" y2="272" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="300" y2="300" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="328" y2="328" stroke="#e4e4e4"></line><line x1="150" x2="560" y1="356" y2="356" stroke="#e4e4e4"></line></g><g><line x1="382.3333333333333" x2="382.3333333333333" y1="80" y2="372" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"></line><text x="382.3333333333333" y="74" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1f1f">Al2O3: 1,055</text></g><g><g><text x="24" y="108" font-size="12" fill="#1f1f1f">Y2O3</text><circle cx="524.4666666666667" cy="104" r="5.5" fill="white" stroke="#2a6fd4" stroke-width="1.75"><title>Y2O3: 1,211 kJ per mol O2 (approximate)</title></circle><text x="534.4666666666667" y="108" text-anchor="start" font-size="11.5" fill="#5c5c5c">~1,211</text></g><g><text x="24" y="136" font-size="12" fill="#1f1f1f">CaO</text><circle cx="520.8222222222223" cy="132" r="5.5" fill="#2a6fd4" stroke="#2a6fd4" stroke-width="1.75"><title>CaO: 1,207 kJ per mol O2 (NIST-JANAF)</title></circle><text x="530.8222222222223" y="136" text-anchor="start" font-size="11.5" fill="#5c5c5c">1,207</text></g><g><text x="24" y="164" font-size="12" fill="#1f1f1f">ThO2</text><circle cx="486.2" cy="160" r="5.5" fill="white" stroke="#2a6fd4" stroke-width="1.75"><title>ThO2: 1,169 kJ per mol O2 (approximate)</title></circle><text x="496.2" y="164" text-anchor="start" font-size="11.5" fill="#5c5c5c">~1,169</text></g><g><text x="24" y="192" font-size="12" fill="#1f1f1f">BeO</text><circle cx="476.1777777777778" cy="188" r="5.5" fill="#2a6fd4" stroke="#2a6fd4" stroke-width="1.75"><title>BeO: 1,158 kJ per mol O2 (NIST-JANAF)</title></circle><text x="486.1777777777778" y="192" text-anchor="start" font-size="11.5" fill="#5c5c5c">1,158</text></g><g><text x="24" y="220" font-size="12" fill="#1f1f1f">MgO</text><circle cx="457.9555555555555" cy="216" r="5.5" fill="#2a6fd4" stroke="#2a6fd4" stroke-width="1.75"><title>MgO: 1,138 kJ per mol O2 (NIST-JANAF)</title></circle><text x="467.9555555555555" y="220" text-anchor="start" font-size="11.5" fill="#5c5c5c">1,138</text></g><g><text x="24" y="248" font-size="12" fill="#1f1f1f">HfO2</text><circle cx="412.4" cy="244" r="5.5" fill="white" stroke="#2a6fd4" stroke-width="1.75"><title>HfO2: 1,088 kJ per mol O2 (approximate)</title></circle><text x="422.4" y="248" text-anchor="start" font-size="11.5" fill="#5c5c5c">~1,088</text></g><g><text x="24" y="276" font-size="12" fill="#1f1f1f">ZrO2</text><circle cx="368.66666666666663" cy="272" r="5.5" fill="#b5b2a7" stroke="#b5b2a7" stroke-width="1.75"><title>ZrO2: 1,040 kJ per mol O2 (NIST-JANAF)</title></circle><text x="358.66666666666663" y="276" text-anchor="end" font-size="11.5" fill="#5c5c5c">1,040</text></g><g><text x="24" y="304" font-size="12" fill="#1f1f1f">UO2</text><circle cx="361.37777777777774" cy="300" r="5.5" fill="white" stroke="#b5b2a7" stroke-width="1.75"><title>UO2: 1,032 kJ per mol O2 (approximate)</title></circle><text x="351.37777777777774" y="304" text-anchor="end" font-size="11.5" fill="#5c5c5c">~1,032</text></g><g><text x="24" y="332" font-size="12" fill="#1f1f1f">TiO2</text><circle cx="225.6222222222222" cy="328" r="5.5" fill="#b5b2a7" stroke="#b5b2a7" stroke-width="1.75"><title>TiO2: 883 kJ per mol O2 (NIST-JANAF)</title></circle><text x="215.6222222222222" y="332" text-anchor="end" font-size="11.5" fill="#5c5c5c">883</text></g><g><text x="24" y="360" font-size="12" fill="#1f1f1f">SiO2</text><circle cx="199.2" cy="356" r="5.5" fill="#b5b2a7" stroke="#b5b2a7" stroke-width="1.75"><title>SiO2: 854 kJ per mol O2 (NIST-JANAF)</title></circle><text x="189.2" y="360" text-anchor="end" font-size="11.5" fill="#5c5c5c">854</text></g></g><g><text x="580" y="192" font-size="11.5" fill="#5c5c5c">excluded: moderator</text><text x="580" y="220" font-size="11.5" fill="#5c5c5c">excluded: Mg boils off</text><text x="580" y="248" font-size="11.5" fill="#5c5c5c">excluded: Hf absorbs</text><text x="580" y="136" font-size="11.5" font-weight="600" fill="#1f1f1f">usable: Y2O3, CaO, ThO2</text></g><g><circle cx="30" cy="408" r="5" fill="#2a6fd4"></circle><text x="42" y="412" font-size="11.5" fill="#5c5c5c">More stable than Al2O3: not reduced by Al</text><circle cx="330" cy="408" r="5" fill="#b5b2a7"></circle><text x="342" y="412" font-size="11.5" fill="#5c5c5c">Reduced by molten Al (aluminothermic)</text><circle cx="30" cy="432" r="5" fill="white" stroke="#5c5c5c" stroke-width="1.75"></circle><text x="42" y="436" font-size="11.5" fill="#5c5c5c">Filled: NIST-JANAF via the property database. Hollow (~): not in JANAF, approximate, pending a reference.</text></g></svg>
