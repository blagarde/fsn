<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 0 760 430" role="img" aria-label="Diborides dissolve ten times more between 1,600 and 2,100 K; AlN solubility is high but flat" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">Above ~1,800 K, liquid Al dissolves more than 0.1 at% of every Al-side wall</text><text x="24" y="48" font-size="11.5" fill="#5c5c5c">Saturation content of Zr, Ti or N in liquid Al (atom %, log scale). Calculated: COST 507 CALPHAD; ZrB2 phase added from NIST-JANAF.</text><g><g><line x1="80" x2="640" y1="360" y2="360" stroke="#e4e4e4"></line><text x="72" y="364" text-anchor="end" font-size="11.5" fill="#5c5c5c">0.01%</text></g><g><line x1="80" x2="640" y1="293.20302433924724" y2="293.20302433924724" stroke="#e4e4e4"></line><text x="72" y="297.20302433924724" text-anchor="end" font-size="11.5" fill="#5c5c5c">0.03%</text></g><g><line x1="80" x2="640" y1="220" y2="220" stroke="#e4e4e4"></line><text x="72" y="224" text-anchor="end" font-size="11.5" fill="#5c5c5c">0.1%</text></g><g><line x1="80" x2="640" y1="153.20302433924726" y2="153.20302433924726" stroke="#e4e4e4"></line><text x="72" y="157.20302433924726" text-anchor="end" font-size="11.5" fill="#5c5c5c">0.3%</text></g><g><line x1="80" x2="640" y1="80" y2="80" stroke="#e4e4e4"></line><text x="72" y="84" text-anchor="end" font-size="11.5" fill="#5c5c5c">1%</text></g><text x="24" y="70" font-size="11.5" fill="#5c5c5c">Solute in liquid Al</text></g><line x1="80" x2="640" y1="220" y2="220" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5 4"></line><text x="86" y="214" font-size="11.5" fill="#5c5c5c">R2 margin 0.1 at%</text><g><line x1="293.4222222222222" x2="293.4222222222222" y1="80" y2="360" stroke="#9b9b9b" stroke-dasharray="2 3"></line><text x="297.4222222222222" y="92" font-size="11" fill="#5c5c5c">A1 outlet ~1,570 °C</text></g><g><line x1="405.4222222222222" x2="405.4222222222222" y1="80" y2="360" stroke="#9b9b9b" stroke-dasharray="2 3"></line><text x="409.4222222222222" y="92" font-size="11" fill="#5c5c5c">A2 outlet ~1,750 °C</text></g><g><line x1="80" x2="640" y1="360" y2="360" stroke="#9b9b9b"></line><text x="80" y="378" text-anchor="middle" font-size="11.5" fill="#5c5c5c">1,500</text><text x="204.44444444444446" y="378" text-anchor="middle" font-size="11.5" fill="#5c5c5c">1,700</text><text x="328.8888888888889" y="378" text-anchor="middle" font-size="11.5" fill="#5c5c5c">1,900</text><text x="453.3333333333333" y="378" text-anchor="middle" font-size="11.5" fill="#5c5c5c">2,100</text><text x="577.7777777777778" y="378" text-anchor="middle" font-size="11.5" fill="#5c5c5c">2,300</text><text x="640" y="400" text-anchor="end" font-size="11.5" fill="#5c5c5c">Temperature (K)</text></g><g><path d="M142.2 268.0L328.9 182.5L453.3 138.6L577.8 101.8" fill="none" stroke="#2a6fd4" stroke-width="2"></path><circle cx="142.22222222222223" cy="268.0121806000054" r="3.5" fill="#2a6fd4"><title>ZrB2 at 1600 K: 0.0454% in liquid Al</title></circle><circle cx="328.8888888888889" cy="182.46463782681303" r="3.5" fill="#2a6fd4"><title>ZrB2 at 1900 K: 0.1854% in liquid Al</title></circle><circle cx="453.3333333333333" cy="138.5907640792741" r="3.5" fill="#2a6fd4"><title>ZrB2 at 2100 K: 0.3815% in liquid Al</title></circle><circle cx="577.7777777777778" cy="101.7731953956046" r="3.5" fill="#2a6fd4"><title>ZrB2 at 2300 K: 0.699% in liquid Al</title></circle><text x="585.7777777777778" y="105.7731953956046" font-size="12" font-weight="600" fill="#1f1f1f">ZrB2</text></g><g><path d="M142.2 316.1L328.9 231.5L453.3 187.2L577.8 149.4" fill="none" stroke="#b5b2a7" stroke-width="2"></path><circle cx="142.22222222222223" cy="316.0585891483185" r="3.5" fill="#b5b2a7"><title>TiB2 at 1600 K: 0.0206% in liquid Al</title></circle><circle cx="328.8888888888889" cy="231.47575285011678" r="3.5" fill="#b5b2a7"><title>TiB2 at 1900 K: 0.0828% in liquid Al</title></circle><circle cx="453.3333333333333" cy="187.2030225869695" r="3.5" fill="#b5b2a7"><title>TiB2 at 2100 K: 0.1715% in liquid Al</title></circle><circle cx="577.7777777777778" cy="149.35505211012648" r="3.5" fill="#b5b2a7"><title>TiB2 at 2300 K: 0.3196% in liquid Al</title></circle><text x="585.7777777777778" y="153.35505211012648" font-size="12" font-weight="600" fill="#1f1f1f">TiB2</text></g><g><path d="M142.2 232.5L328.9 216.5L453.3 208.4L577.8 201.7" fill="none" stroke="#1f1f1f" stroke-width="2"></path><circle cx="142.22222222222223" cy="232.51258331551185" r="3.5" fill="#1f1f1f"><title>AlN at 1600 K: 0.0814% in liquid Al</title></circle><circle cx="328.8888888888889" cy="216.5145655849521" r="3.5" fill="#1f1f1f"><title>AlN at 1900 K: 0.1059% in liquid Al</title></circle><circle cx="453.3333333333333" cy="208.35981995997267" r="3.5" fill="#1f1f1f"><title>AlN at 2100 K: 0.1211% in liquid Al</title></circle><circle cx="577.7777777777778" cy="201.6632631752136" r="3.5" fill="#1f1f1f"><title>AlN at 2300 K: 0.1352% in liquid Al</title></circle><text x="585.7777777777778" y="205.6632631752136" font-size="12" font-weight="600" fill="#1f1f1f">AlN</text></g></svg>
