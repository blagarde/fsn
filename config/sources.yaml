# Registry of data sources. Tiers:
#   A  evaluated or primary reference data (nuclear data libraries, NIST SRDs)
#   B  compiled handbooks and recommended-value reviews
#   C  single peer-reviewed papers, computed databases (DFT, CALPHAD assessments)
# status: implemented (automatic ingester exists), manual (values entered from the
# document via data/manual/*.csv), planned, blocked (not reachable or needs an account).
# Bibliographic details marked "verify" were written from memory and must be checked
# against the document when it is acquired.

sources:
  - source_id: iaea_livechart
    name: IAEA LiveChart of Nuclides (ground states)
    publisher: IAEA Nuclear Data Section
    url: https://nds.iaea.org/relnsd/v1/data?fields=ground_states&nuclides=all
    tier: A
    kind: nuclear-structure
    access: api
    status: implemented
    license: IAEA terms of use, free for research
    citation: IAEA Nuclear Data Section, LiveChart of Nuclides API, data evaluated in ENSDF; masses from the Atomic Mass Evaluation.
    notes: Abundances, half-lives, decay modes, spins, masses. Each row carries its ENSDF evaluation cut-off date.

  - source_id: endfb80
    name: ENDF/B-VIII.0 neutron sublibrary
    publisher: CSEWG / NNDC, Brookhaven National Laboratory
    url: https://www.nndc.bnl.gov/endf-b8.0/zips/ENDF-B-VIII.0_neutrons.zip
    version: VIII.0
    tier: A
    kind: nuclear-reaction
    access: download
    status: implemented
    license: Public
    citation: D.A. Brown et al., "ENDF/B-VIII.0 - The 8th Major Release of the Nuclear Reaction Data Library", Nuclear Data Sheets 148 (2018) 1-142.
    notes: Single evaluations extracted from the archive with HTTP range requests; resonances reconstructed and Doppler-broadened with NJOY2016.

  - source_id: nist_janaf
    name: NIST-JANAF Thermochemical Tables
    publisher: NIST
    url: https://janaf.nist.gov/
    version: 4th edition
    tier: A
    kind: thermochemistry
    access: download
    status: implemented
    license: Public (US Government work)
    citation: M.W. Chase Jr., NIST-JANAF Thermochemical Tables, 4th ed., J. Phys. Chem. Ref. Data Monograph 9 (1998).
    notes: Cp, S, H, Gibbs function, enthalpy and Gibbs energy of formation, 0-6000 K. Coverage is light elements and their compounds; few actinides, no Y/Th oxides.

  - source_id: nist_webbook
    name: NIST Chemistry WebBook (SRD 69)
    publisher: NIST
    url: https://webbook.nist.gov/chemistry/
    tier: A
    kind: thermochemistry
    access: download
    status: planned
    license: Public (US Government work)
    citation: P.J. Linstrom and W.G. Mallard (eds.), NIST Chemistry WebBook, NIST Standard Reference Database Number 69.
    notes: Phase-change data and Antoine vapour-pressure fits for elements and compounds.

  - source_id: sgte_unary
    name: SGTE data for pure elements (unary database)
    url: https://github.com/sundmanbo/opencalphad/tree/master/examples/macros
    tier: A
    kind: thermochemistry
    access: download
    status: implemented
    citation: A.T. Dinsdale, "SGTE data for pure elements", CALPHAD 15 (1991) 317-425; 1991-2010 updates.
    notes: Gibbs energy functions of every element in solid and liquid states, including those JANAF lacks (Sn, U, Th, Y, Pu). Currently taken from the copy distributed with OpenCalphad (pinned commit); verify against the SGTE original.

  - source_id: cost507
    name: COST 507 thermochemical database for light metal alloys
    url: https://github.com/sundmanbo/opencalphad/tree/master/examples/macros
    tier: B
    kind: phase-diagram
    access: download
    status: implemented
    citation: I. Ansara, A.T. Dinsdale, M.H. Rand (eds.), COST 507 Thermochemical Database for Light Metal Alloys, vol. 2, European Commission (1998). (verify)
    notes: About 70 assessed binaries and some ternaries of 20 elements, Al-based (Al, B, C, Cr, Cu, Fe, Li, Mg, Mn, N, Ni, Si, Sn, Ti, V, Y, Zn, Zr and others). Copy distributed with OpenCalphad.

  - source_id: opencalphad_examples
    name: OpenCalphad example databases
    url: https://github.com/sundmanbo/opencalphad
    tier: C
    kind: phase-diagram
    access: download
    status: implemented
    license: Distributed with OpenCalphad (GPL software); individual assessments keep their authors' terms
    notes: Mixed provenance; several files carry no citation (e.g. OU.TDB). Use for screening only until each file is traced to a published assessment.

  - source_id: pycalphad_testdbs
    name: pycalphad test and example databases
    url: https://github.com/pycalphad/pycalphad/tree/develop/pycalphad/tests/databases
    tier: C
    kind: phase-diagram
    access: download
    status: implemented
    license: Distributed with pycalphad (MIT software); individual assessments keep their authors' terms
    notes: Published assessments named in file names and headers (e.g. Dupin 2001 Al-Ni, Sundman 2009 Al-Fe, Lindwall 2015 Al-Fe-O). Some are reduced test versions; check the header before relying on one.

  - source_id: thermochimica_data
    name: Thermochimica data files
    url: https://github.com/ORNL-CEES/thermochimica/tree/master/data
    tier: C
    kind: phase-diagram
    access: download
    status: implemented
    license: BSD-3-Clause (repository)
    notes: ChemSage DAT files incl. fission-product noble metals (Kaye), Cs-I, Cs-Te, a fluoride/chloride salt system and Zr alloys. Some are test cases.

  - source_id: tdbdb
    name: TDBDB, index of published CALPHAD databases
    tier: B
    kind: phase-diagram
    access: download
    status: blocked
    notes: Index of published TDB files and their papers; potentially the best route to open assessments of actinide systems. www.tdbdb.cz and tdbdb.cz are allowed but the proxy returns 502 (name wrong or site down); correct address still to find.

  - source_id: nims_cpddb
    name: NIMS Computational Phase Diagram Database (CPDDB)
    publisher: National Institute for Materials Science, Japan
    url: https://cpddb.nims.go.jp/
    tier: B
    kind: phase-diagram
    access: licensed
    status: blocked
    citation: T. Abe et al., CPDDB, National Institute for Materials Science (2007), doi:10.48505/NIMS.3060.
    notes: 700+ TDB files (unary, binary, multicomponent). Requires a DICE account, e-mail domain registration and a service application; bulk download and scraping are prohibited by the MatNavi terms. Files are downloaded by hand, one per needed system, and registered with `local:` entries.

  - source_id: nist_calphad
    name: NIST Solder Systems thermodynamic database (SRD 139)
    publisher: NIST
    url: http://www.metallurgy.nist.gov/phase/solder/solder.tdb
    tier: A
    kind: phase-diagram
    access: download
    status: blocked
    notes: Found via the data.nist.gov records API. Pb-Bi-Sn-Ag-Cu-In-Sb-Zn family (relevant to lead and tin coolants); no actinides. Host www.metallurgy.nist.gov not in the allowlist. NIST holds no actinide CALPHAD databases.

  - source_id: nist_alloy_data
    name: NIST Alloy Data (thermophysical properties of metals)
    publisher: NIST
    url: https://trc.nist.gov/metals_data
    tier: A
    kind: thermophysical
    access: download
    status: blocked
    notes: Measured density, viscosity, surface tension, heat capacity, conductivity of unary, binary and ternary metal systems, solid and liquid (data.nist.gov record mds2-2153). Directly useful for liquid Al, Pb, Sn, U. Host trc.nist.gov not in the allowlist.

  - source_id: literature_tdb
    name: CALPHAD assessments published as paper supplements
    tier: C
    kind: phase-diagram
    access: manual
    status: manual
    notes: TDB files from journal supplements (CALPHAD, J. Phase Equilib. Diffus., J. Nucl. Mater.). Add each with its DOI as a calphad_files entry pointing at a cached copy.

  - source_id: konings2014_actinide_oxides
    name: Thermodynamic properties of the f-elements and their compounds, part 2 (lanthanide and actinide oxides)
    tier: B
    kind: thermochemistry
    access: manual
    status: manual
    citation: R.J.M. Konings et al., J. Phys. Chem. Ref. Data 43 (2014) 013101. (verify)
    notes: Recommended values for UO2, ThO2, PuO2 and lanthanide oxides; fills JANAF gaps.

  - source_id: nea_tdb_uranium
    name: OECD/NEA Chemical Thermodynamics of Uranium (TDB update)
    publisher: OECD Nuclear Energy Agency
    tier: A
    kind: thermochemistry
    access: manual
    status: manual
    citation: R. Guillaumont et al., Update on the Chemical Thermodynamics of Uranium, Neptunium, Plutonium, Americium and Technetium, Elsevier (2003). (verify)
    notes: Internationally reviewed formation data for U, Np, Pu, Am compounds.

  - source_id: jeff33
    name: JEFF-3.3 evaluated nuclear data library
    publisher: OECD Nuclear Energy Agency
    url: https://www.oecd-nea.org/dbdata/jeff/jeff33/
    version: "3.3"
    tier: A
    kind: nuclear-reaction
    access: download
    status: blocked
    citation: A.J.M. Plompen et al., "The joint evaluated fission and fusion nuclear data library, JEFF-3.3", Eur. Phys. J. A 56 (2020) 181.
    notes: Host not in the environment allowlist. Needed for library-to-library spread.

  - source_id: jendl5
    name: JENDL-5
    publisher: Japan Atomic Energy Agency
    url: https://wwwndc.jaea.go.jp/jendl/j5/j5.html
    version: "5"
    tier: A
    kind: nuclear-reaction
    access: download
    status: blocked
    citation: O. Iwamoto et al., "Japanese evaluated nuclear data library version 5 - JENDL-5", J. Nucl. Sci. Technol. 60 (2023) 1-60. (verify)
    notes: Host not in the environment allowlist.

  - source_id: iaea_endf_mirror
    name: IAEA NDS evaluated library mirror
    publisher: IAEA Nuclear Data Section
    url: https://www-nds.iaea.org/public/download-endf/
    tier: A
    kind: nuclear-reaction
    access: download
    status: blocked
    notes: Reachable, but downloads sit behind a Cloudflare browser challenge that automated clients cannot pass. NNDC is used instead.

  - source_id: mughabghab2018
    name: Atlas of Neutron Resonances, 6th edition
    publisher: Elsevier
    tier: A
    kind: nuclear-reaction
    access: licensed
    status: manual
    citation: S.F. Mughabghab, Atlas of Neutron Resonances, 6th ed., Elsevier (2018).
    notes: Recommended thermal cross sections and resonance integrals; independent check on library values.

  - source_id: nea_lbe_2015
    name: Handbook on Lead-bismuth Eutectic Alloy and Lead Properties (2015 edition)
    publisher: OECD Nuclear Energy Agency
    tier: B
    kind: thermophysical
    access: manual
    status: manual
    citation: OECD/NEA, Handbook on Lead-bismuth Eutectic Alloy and Lead Properties, Materials Compatibility, Thermal-hydraulics and Technologies, 2015 edition, NEA No. 7268. (verify)
    notes: Recommended correlations for liquid Pb and LBE, corrosion and oxygen control.

  - source_id: iaea_thph_2008
    name: Thermophysical Properties of Materials for Nuclear Engineering
    publisher: IAEA
    tier: B
    kind: thermophysical
    access: manual
    status: manual
    citation: IAEA, Thermophysical Properties of Materials for Nuclear Engineering - A Tutorial and Collection of Data, IAEA-THPH (2008). (verify)
    notes: Fuels (U, Pu, oxides, carbides, nitrides), liquid metals, structural materials.

  - source_id: assael2006_al_fe
    name: Reference data for density and viscosity of liquid aluminium and liquid iron
    tier: B
    kind: thermophysical
    access: manual
    status: manual
    citation: M.J. Assael et al., J. Phys. Chem. Ref. Data 35 (2006) 285. (verify)
    notes: Recommended correlations for liquid Al density and viscosity.

  - source_id: nea_taf_id
    name: Thermodynamics of Advanced Fuels International Database (TAF-ID)
    publisher: OECD Nuclear Energy Agency
    tier: B
    kind: phase-diagram
    access: licensed
    status: blocked
    notes: CALPHAD database for U-Pu-O-C-N-Zr and fission products; restricted to member organisations.

  - source_id: ornl_mstdb_tp
    name: Molten Salt Thermal Properties Database (MSTDB-TP)
    publisher: Oak Ridge National Laboratory
    url: https://mstdb.ornl.gov/
    tier: B
    kind: thermophysical
    access: licensed
    status: blocked
    notes: Requires registration; host not in the allowlist. Needed for chloride and fluoride fuel salts. Its CALPHAD companion MSTDB-TC (Thermochimica format) is the key salt phase-equilibrium source; not found in a public mirror.

  - source_id: materials_project
    name: Materials Project
    url: https://materialsproject.org
    tier: C
    kind: materials
    access: api
    status: blocked
    notes: DFT formation energies and structures; needs an API key and host access. Use only where no measured data exist.

  - source_id: asme_bpvc_iii5
    name: ASME BPVC Section III Division 5 (high-temperature reactors)
    tier: B
    kind: materials
    access: licensed
    status: manual
    notes: Allowable stresses and creep data for Alloy 617, 316H, Grade 91 and others.

  - source_id: literature
    name: Peer-reviewed literature (one paper per entry)
    tier: C
    kind: thermophysical
    access: manual
    status: manual
    notes: Every manual entry must give a DOI or full reference in its locator.
